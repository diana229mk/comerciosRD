# Include these locations in the application's HTTPS server block before
# generic static-file regex locations. Legacy copies remain on disk until
# the documented backup-and-verify migration has been completed.
location ^~ /storage/payables/invoices/ {
    return 404;
}

location ^~ /storage/ecf/ {
    return 404;
}

location ^~ /storage/prescriptions/ {
    return 404;
}

location ^~ /storage/imports/ {
    return 404;
}
