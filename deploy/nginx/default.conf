server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;
    server_tokens off;
    autoindex off;

    client_max_body_size 22m;
    client_body_timeout 30s;
    send_timeout 120s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    include /etc/nginx/snippets/private-storage.conf;

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    location ~* \.(?:env|ini|log|sql|dump|bak|backup|pem|p12|pfx|key|crt|cer|csr|jks|keystore|sqlite|db|conf|ya?ml|lock)$ {
        deny all;
    }

    location ~* \.(?:php[0-9]?|phtml|phar)(?:/|$) {
        return 404;
    }

    location ~* ^/storage/products/(?<product_image_path>.+\.(?:jpe?g|png|gif|webp|avif))$ {
        alias /srv/public-storage/products/$product_image_path;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=3600";
    }

    location /storage/ {
        return 404;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
        fastcgi_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
