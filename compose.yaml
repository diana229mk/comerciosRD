name: comercios-rd-local

x-app-environment: &app-environment
  APP_NAME: ComerciosRD
  APP_ENV: local
  APP_DEBUG: "false"
  APP_KEY: ${COMERCIOS_DOCKER_APP_KEY:?Set a unique local APP_KEY in .env.docker}
  APP_URL: http://localhost:8080
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  DOCKER_LOCAL_ISOLATION: "1"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: comercios_rd_docker_test
  DB_USERNAME: comercios_docker_app
  DB_PASSWORD: ${COMERCIOS_DOCKER_DB_PASSWORD:?Set a local-only DB password in .env.docker}
  DB_URL: ""
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  REDIS_USERNAME: ""
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_QUEUE: ${REDIS_QUEUE:-default}
  REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-180}
  SCALE_POST_SALE_QUEUE: ${SCALE_POST_SALE_QUEUE:-false}
  SCALE_QUEUE_SALES: ${SCALE_QUEUE_SALES:-sales}
  SCALE_QUEUE_REPORTS: ${SCALE_QUEUE_REPORTS:-reports}
  FILESYSTEM_DISK: local
  PRIVATE_FILESYSTEM_DRIVER: local
  ECF_ENABLED: "false"
  PORTABILITY_BACKUP_ENABLED: "false"
  MAIL_MAILER: log

x-app-volumes: &app-volumes
  - public_storage:/var/www/html/storage/app/public
  - private_storage:/var/www/html/storage/app/private
  - framework_storage:/var/www/html/storage/framework
  - app_logs:/var/www/html/storage/logs

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
    target: app
  image: comercios-rd-php:local
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,uid=33,gid=33,mode=1770
    - /var/run:size=8m,uid=33,gid=33,mode=0750
  environment: *app-environment
  volumes: *app-volumes
  networks:
    - backend
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  app:
    <<: *app-service
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$s=@fsockopen('127.0.0.1',9000,$$e,$$m,2); exit($$s ? 0 : 1);"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

  worker:
    <<: *app-service
    stop_grace_period: 120s
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --queue=${SCALE_QUEUE_SALES:-sales},${SCALE_QUEUE_REPORTS:-reports},${REDIS_QUEUE:-default}
      - --sleep=3
      - --tries=3
      - --timeout=90
      - --max-time=3600
      - --memory=256
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$c=@file_get_contents('/proc/2/cmdline'); exit($$c !== false && str_contains($$c,'queue:work') ? 0 : 1);"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app-service
    profiles:
      - scheduler
    stop_grace_period: 30s
    command:
      - php
      - artisan
      - schedule:work
    deploy:
      replicas: 1
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$c=@file_get_contents('/proc/2/cmdline'); exit($$c !== false && str_contains($$c,'schedule:work') ? 0 : 1);"
      interval: 30s
      timeout: 3s
      retries: 3

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: comercios-rd-nginx:local
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:size=32m,uid=101,gid=33,mode=0750
      - /tmp:size=8m,uid=101,gid=33,mode=1770
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - public_storage:/srv/public-storage:ro
    networks:
      - frontend
      - backend
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/up
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    init: true
    environment:
      MYSQL_DATABASE: comercios_rd_docker_test
      MYSQL_USER: comercios_docker_app
      MYSQL_PASSWORD: ${COMERCIOS_DOCKER_DB_PASSWORD:?Set a local-only DB password in .env.docker}
      MYSQL_ROOT_PASSWORD: ${COMERCIOS_DOCKER_MYSQL_ROOT_PASSWORD:?Set a local-only MySQL root password in .env.docker}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    init: true
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  frontend:
    driver: bridge
    internal: false
  backend:
    driver: bridge
    internal: true

volumes:
  mysql_data:
    name: comercios_rd_docker_test_mysql
  redis_data:
    name: comercios_rd_docker_redis
  public_storage:
    name: comercios_rd_docker_public
  private_storage:
    name: comercios_rd_docker_private
  framework_storage:
    name: comercios_rd_docker_framework
  app_logs:
    name: comercios_rd_docker_logs
